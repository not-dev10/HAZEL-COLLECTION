version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: didi-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Database
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://Dexter:dexter_1012@cluster0.awdnale.mongodb.net/?appName=Cluster0}
      # CORS Configuration
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Backend Internal URL (for internal API calls)
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
      BACKEND_HOST: backend
      # Secrets & Auth
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      SESSION_SECRET: ${JWT_SECRET}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Email Configuration
      MAIL_SERVICE: ${MAIL_SERVICE:-gmail}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HezalTheLabel}
      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Rate Limiting
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-false}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
    restart: unless-stopped
    networks:
      - didi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend web service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: didi-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:5000
    restart: unless-stopped
    networks:
      - didi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: MongoDB for local development (comment out if using MongoDB Atlas)
  # mongodb:
  #   image: mongo:6.0-alpine
  #   container_name: didi-mongodb
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
  #     MONGO_INITDB_DATABASE: didi_fashion
  #   volumes:
  #     - mongodb_data:/data/db
  #   restart: unless-stopped
  #   networks:
  #     - didi-network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

networks:
  didi-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
