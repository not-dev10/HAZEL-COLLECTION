services:
  - type: web
    name: didi-fashion-backend
    runtime: node
    runtimeVersion: 20.10.0
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: FRONTEND_URL
        fromService:
          name: didi-fashion-frontend
          type: web
          property: url
    autoDeploy: false
    plan: free
    
  - type: web
    name: didi-fashion-frontend
    runtime: node
    runtimeVersion: 20.10.0
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          name: didi-fashion-backend
          type: web
          property: url
    autoDeploy: false
    plan: free
