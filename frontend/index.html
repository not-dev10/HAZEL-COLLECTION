<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Hezal Couture | Luxury Fashion & Designer Bridal Wear</title>
    <meta name="title" content="Hezal Couture | Luxury Fashion & Designer Bridal Wear" />
    <meta name="description" content="Discover exquisite fashion at Hezal Couture. Shop luxury bridal wear, ready-to-wear, and unstitched collections crafted with traditional artistry. Premium designer clothing for special occasions." />
    <meta name="keywords" content="luxury fashion, bridal wear, designer clothing, ready to wear, unstitched fabric, traditional fashion, couture, designer bridal, wedding dresses, ethnic wear, premium fashion" />
    <meta name="author" content="Hezal Couture" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://hezalcouture.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hezalcouture.com/" />
    <meta property="og:site_name" content="Hezal Couture" />
    <meta property="og:title" content="Hezal Couture | Luxury Fashion & Designer Bridal Wear" />
    <meta property="og:description" content="Discover exquisite fashion. Shop luxury bridal wear, ready-to-wear, and unstitched collections crafted with traditional artistry." />
    <meta property="og:image" content="https://hezalcouture.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hezal Couture - Luxury Fashion" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hezalcouture.com/" />
    <meta name="twitter:site" content="@hezalcouture" />
    <meta name="twitter:creator" content="@hezalcouture" />
    <meta name="twitter:title" content="Hezal Couture | Luxury Fashion & Designer Bridal Wear" />
    <meta name="twitter:description" content="Discover exquisite fashion. Shop luxury bridal wear, ready-to-wear, and unstitched collections." />
    <meta name="twitter:image" content="https://hezalcouture.com/og-image.png" />
    <meta name="twitter:image:alt" content="Hezal Couture - Luxury Fashion" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Hezal Couture" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Hezal Couture",
      "url": "https://hezalcouture.com",
      "logo": "https://hezalcouture.com/favicon.png",
      "description": "Luxury fashion brand specializing in bridal wear, ready-to-wear, and unstitched collections",
      "sameAs": [
        "https://twitter.com/hezalcouture",
        "https://facebook.com/hezalcouture",
        "https://instagram.com/hezalcouture"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "info@hezalcouture.com"
      }
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Hezal Couture",
      "url": "https://hezalcouture.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hezalcouture.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <div id="root"></div>
